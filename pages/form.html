<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap"
      rel="stylesheet"
    />
    <title>Big Form</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="background">
    <form>
      <div class="label">
        <label for="nom">Nom</label>
        <input id="nom" type="text" required placeholder="Dupont" />
      </div>
      <div class="label">
        <label for="prénom">Prénom</label>
        <input id="nom" type="text" required placeholder="Jean" />
      </div>
      <div class="label">
        <label for="email">Adresse e-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          placeholder="Jean@email.com"
        />
      </div>
      <div class="label">
        <label for="phone">Téléphone</label>
        <input
          id="tel"
          name="tel"
          type="tel"
          required
          placeholder="079 123 45 67"
        />
      </div>
      <div class="conditions-suivant">
        <div class="div-checkbox">
          <input
            id="newsletter"
            name="newsletter"
            type="checkbox"
            value="oui"
          />
          <label class="checkbox-text" for="newsletter">
            Accepter les conditions d’<a>utilisation générales. </a>
          </label>
        </div>
        <button id="btn-open">Suivant</button>
      </div>

        </div>
      </div>
    </form>
    <script src="../script.js"></script>
  </body>
</html>
