<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap"
      rel="stylesheet"
    />
    <title>Big Form</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="background">
    <img class="logo" src="../anuel.png" alt="logo anuel" />
    <form>
      <div class="label">
        <label for="nom">Nom</label>
        <input id="nom" type="text" required placeholder="Dupont" />
      </div>
      <div class="label">
        <label for="prénom">Prénom</label>
        <input
          id="prénom"
          type="text"
          name="prenom"
          required
          placeholder="Jean"
        />
      </div>
      <div class="label">
        <label for="email">Adresse e-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          placeholder="Jean@email.com"
        />
      </div>
      <div class="label">
        <label for="phone">Téléphone</label>
        <input
          id="phone"
          name="tel"
          type="tel"
          required
          placeholder="079 123 45 67"
        />
      </div>
      <div class="label">
        <label for="adresse">Adresse</label>
        <input
          id="tadresse"
          name="adresse"
          type="text"
          required
          placeholder="Rte 1, 1700 Fribourg, CH"
        />
      </div>
      <div class="conditions-suivant">
        <div class="div-checkbox">
          <input
            id="newsletter"
            name="newsletter"
            type="checkbox"
            value="oui"
          />
          <label class="checkbox-text" for="newsletter">
            Accepter les conditions d’<a>utilisation générales. </a>
          </label>
        </div>
        <button id="openPopupBtn" class="trigger-btn">Next</button>

        <div id="popupOverlay" class="popup-overlay">
          <div class="popup-content">
            <h1 class="popup-title">Une dernière chose ...</h1>

            <p class="popup-text">
              Salut, veux-tu t’inscrire à notre newsletter pour recevoir toutes
              nos nouvelles offres ?
            </p>

            <div class="popup-buttons">
              <a href="validate.html" class="btn-redirect btn-primary"
                >Oui, continuer</a
              >
              <a href="validate.html" class="btn-redirect btn-secondary"
                >Non merci</a
              >
            </div>
          </div>
        </div>
      </div>
    </form>
    <script src="../script.js"></script>
  </body>
</html>
